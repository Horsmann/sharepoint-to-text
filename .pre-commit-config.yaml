repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  # Remove unused imports (unneeded dependencies)
  - repo: https://github.com/hadialqattan/pycln
    rev: v2.5.0
    hooks:
      - id: pycln
        args: ["--all"]

  # Sort imports
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Format code
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        language_version: python3

  # Lint (after formatting & cleanup)
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--extend-ignore=E203,E501"]

  # Type checking (run locally: pre-commit run mypy --all)
  # Note: For comprehensive type checking with all dependencies, use: uv run mypy sharepoint2text --exclude tests
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-warn-unused-ignores, --disable-error-code=attr-defined, --disable-error-code=assignment, --exclude=tests/]
        exclude: ^sharepoint2text/tests/
